# Local run: PostgreSQL 16 and Vartija. Copy .env.example to .env first.
#
# Vartija uses the host network: an ARP sweep only reaches the L2 segments
# the host is attached to, never through Docker's bridge.
services:
  db:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_DB: vartija
      POSTGRES_USER: vartija
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vartija -d vartija"]
      interval: 5s
      timeout: 3s
      retries: 10

  vartija:
    build: .
    image: vartija:local
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    environment:
      VARTIJA_DATABASE_URL: postgres://vartija:${POSTGRES_PASSWORD}@127.0.0.1:5432/vartija?sslmode=disable
      # Plain HTTP on localhost
      VARTIJA_SECURE_COOKIE: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db:
